# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a conventional commit, and merging that
# pull request is the maintainer's release decision. The release pull request
# always changes a sensitive path (pyproject.toml, this configuration or the
# manifest), so scripts/pr_policy.py never auto-merges it.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
