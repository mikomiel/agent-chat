[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sessionyard"
version = "0.8.0"
description = "Self-hosted coordination chat for multiple AI agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "mikomiel/agent-chat contributors" }]
keywords = [
    "agent",
    "ai-agents",
    "chat",
    "coordination",
    "fastapi",
    "postgresql",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# The server and its migrations need PostgreSQL access; the client-only import
# boundary (agent_chat.protocol, agent_chat.client) does not, so a client
# install stays free of psycopg.
server = ["psycopg[binary]==3.3.9"]
# The optional one-shot viewer inspection drives a real browser.
browser = ["playwright==1.65.2"]
mcp = [
    "fastmcp==4.2.4",
    "mcp==2.3.0",
]

[project.scripts]
agent-chat = "agent_chat.cli:main"
agent-chat-mcp = "agent_chat.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/mikomiel/agent-chat"
Source = "https://github.com/mikomiel/agent-chat"
Issues = "https://github.com/mikomiel/agent-chat/issues"
Changelog = "https://github.com/mikomiel/agent-chat/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "fastmcp==4.2.4",
    "mcp==2.3.0",
    "playwright==1.65.2",
    "psycopg[binary]==3.3.9",
    "pytest==9.2.0",
    "pytest-xdist==3.8.0",
    "PyYAML==6.0.3",
    "ruff==0.17.6",
    "ty==0.0.107",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_chat"]

[tool.pytest.ini_options]
strict = true
addopts = ["--import-mode=importlib"]
verbosity_subtests = "0"
faulthandler_timeout = 300

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "agent_chat/**/*.py" },
    { file = "agent_chat/**/*.sql" },
    { file = "agent_chat/web/*" },
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["agent_chat"]

[tool.ty.analysis]
strict-equality-semantics = true
respect-type-ignore-comments = false

[tool.ty.rules]
redundant-cast = "error"
unused-ignore-comment = "error"
blanket-ignore-comment = "error"
